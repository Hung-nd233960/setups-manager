[project]
name = "setups-manager"
version = "0.1.0"
description = "Check and manage the Setups machine configuration (CLI and Textual TUI)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "textual>=8.2.8",
]

[project.scripts]
setups = "setups_manager.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
