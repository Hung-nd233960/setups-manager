[project]
name = "setups-manager"
version = "0.1.0"
description = "Check and manage the Setups machine configuration (CLI now, Textual TUI next)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
setups = "setups_manager.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
